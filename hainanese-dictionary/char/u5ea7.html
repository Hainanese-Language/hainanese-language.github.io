<ul class="senses"><li><span class="num">①</span><span><span class="zh">座位。～次、入～、让～、满～。</span><span class="en">A seat. 座次; 入座; 让座; 满座.</span></span></li><li><span class="num">②</span><span><span class="zh">器物的托底。底～、钟～、花瓶～。</span><span class="en">A stand; a base. 底座; 钟座; 花瓶座.</span></span></li><li><span class="num">③</span><span><span class="zh">量词，用于较大的固定物体。一～山、两～桥、几～楼。</span><span class="en">Measure word for large fixed objects. 一座山; 两座桥; 几座楼.</span></span></li></ul><div class="alt"><span class="r2">do⁴</span><button class="play" style="width:26px;height:26px;font-size:10px" onclick="play('to4.mp3')">&#9654;</button></div></div><footer>

}
