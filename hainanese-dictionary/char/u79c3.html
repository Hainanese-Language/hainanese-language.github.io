<ul class="senses"><li><span class="num">①</span><span><span class="zh">头顶没有头发；表面光而无毛。～顶、～头。</span><span class="en">Bald; hairless.</span></span></li><li><span class="num">②</span><span><span class="zh">树木没有枝叶；山上没有草木。～树、～山。</span><span class="en">Bare, of trees or hills.</span></span></li><li><span class="num">③</span><span><span class="zh">失去尖端。～笔、笔尖写～了。</span><span class="en">Blunt; having lost its point.</span></span></li><li><span class="num">④</span><span><span class="zh">文章首尾不完整。结尾显得有点～。</span><span class="en">Incomplete at the beginning or end, of a piece of writing.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
document.addEventListener('click',function(ev){
  document.querySelectorAll('.tip.open').forEach(function(t){
    if(!t.contains(ev.target)) t.classList.remove('open');});
  var t=ev.target.closest('.tip');
  if(t){ t.classList.toggle('open'); }
});
function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";
function doSearch(){
  var v=document.getElementById('q').value.trim();
  if(v) location.href=SITE+'/?q='+encodeURIComponent(v);
}
document.getElementById('q').addEventListener('keydown',function(e){
  if(e.key==='Enter') doSearch();
});
</script>
