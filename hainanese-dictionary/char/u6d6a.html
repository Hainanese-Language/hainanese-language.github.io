<ul class="senses"><li><span class="num">①</span><span><span class="zh">波浪。海～、～花、风平～静。</span><span class="en">A wave. 海浪; 浪花; 风平浪静.</span></span></li><li><span class="num">②</span><span><span class="zh">像波浪起伏的东西。麦～、声～。</span><span class="en">Something that rises and falls like waves. 麦浪; 声浪.</span></span></li><li><span class="num">③</span><span><span class="zh">放纵；不受约束。～费、放～、～荡。</span><span class="en">Unrestrained; dissolute. 浪费; 放浪; 浪荡.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";
function doSearch(){
  var v=document.getElementById('q').value.trim();
  if(v) location.href=SITE+'/?q='+encodeURIComponent(v);
}
document.getElementById('q').addEventListener('keydown',function(e){
  if(e.key==='Enter') doSearch();
});
</script>
