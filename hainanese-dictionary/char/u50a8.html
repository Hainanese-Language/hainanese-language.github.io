<ul class="senses"><li><span class="num">①</span><span><span class="zh">积蓄；存放。～存、～蓄、～备、～量。</span><span class="en">To store up. 储存 to stockpile; 储蓄 to save; 储备 a reserve; 储量 reserves.</span></span></li><li><span class="num">②</span><span><span class="zh">已确定继承皇位的人。～君、王～、立～。</span><span class="en">The designated heir to the throne. 储君 the crown prince; 王储 the heir apparent; 立储 to name an heir.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
function play(name){
  var list=name.split('|'), i=0;

    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";

}

});
