<ul class="senses"><li><span class="num">①</span><span><span class="zh">马虎；随便。～且、不～言笑、一丝不～。</span><span class="en">Careless; casual. 苟且; 不苟言笑; 一丝不苟.</span></span></li><li><span class="num">②</span><span><span class="zh"><span class="pill tip" data-tip="书面语。多见于书面或文言，口语少用。">书</span>姑且；暂且。～安、～活、～延残喘。</span><span class="en"><span class="pill tip" data-tip="Literary. Chiefly written or classical style; rare in speech.">lit.</span> For the moment; merely to get by. 苟安; 苟活; 苟延残喘.</span></span></li><li><span class="num">③</span><span><span class="zh"><span class="pill tip" data-tip="书面语。多见于书面或文言，口语少用。">书</span>如果。～非其人。</span><span class="en"><span class="pill tip" data-tip="Literary. Chiefly written or classical style; rare in speech.">lit.</span> If. 苟非其人.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
document.addEventListener('click',function(ev){

  if(t){ t.classList.toggle('open'); }

function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";

}

});
