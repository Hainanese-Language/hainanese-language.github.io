<ul class="senses"><li><span class="num">①</span><span><span class="zh">表示敬意的礼节。～见、跪～、～寿。</span><span class="en">to make an obeisance; pay respects.</span></span></li><li><span class="num">②</span><span><span class="zh">用一定的礼节结成某种关系。～师、结～、～把子。</span><span class="en">to enter into a relationship through a set ceremony.</span></span></li><li><span class="num">③</span><span><span class="zh">敬辞，用于人事往来。～托、～读、～访。</span><span class="en">respectful form used in social dealings.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";
function doSearch(){
  var v=document.getElementById('q').value.trim();
  if(v) location.href=SITE+'/?q='+encodeURIComponent(v);
}
document.getElementById('q').addEventListener('keydown',function(e){
  if(e.key==='Enter') doSearch();
});
</script>
