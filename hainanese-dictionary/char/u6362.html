<ul class="senses"><li><span class="num">①</span><span><span class="zh">给出东西同时取得别的东西。交～、～工、以物～物。</span><span class="en">To exchange. 交换; 换工; 以物换物.</span></span></li><li><span class="num">②</span><span><span class="zh">变换；更改。～季、～班、～衣服、～汤不～药。</span><span class="en">To change; to switch. 换季; 换班; 换衣服; 换汤不换药.</span></span></li><li><span class="num">③</span><span><span class="zh">兑换。～钱、～外币。</span><span class="en">To change money. 换钱; 换外币.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
document.addEventListener('click',function(ev){
  document.querySelectorAll('.tip.open').forEach(function(t){
    if(!t.contains(ev.target)) t.classList.remove('open');});
  var t=ev.target.closest('.tip');
  if(t){ t.classList.toggle('open'); }

function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";

}
document.getElementById('q').addEventListener('keydown',function(e){
  if(e.key==='Enter') doSearch();
});
