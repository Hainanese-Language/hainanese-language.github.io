<ul class="senses"><li><span class="num">①</span><span><span class="zh">轻视。轻～、～视。</span><span class="en">To despise. 轻蔑 contemptuous; 蔑视 to scorn.</span></span></li><li><span class="num">②</span><span><span class="zh">无；没有。～以复加。</span><span class="en">To be without; none. 蔑以复加 nothing could exceed it.</span></span></li><li><span class="num">③</span><span><span class="zh">涂污；捏造罪名。污～、诬～。</span><span class="en">To smear; fabricate charges. 污蔑 to slander.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";
function doSearch(){
  var v=document.getElementById('q').value.trim();
  if(v) location.href=SITE+'/?q='+encodeURIComponent(v);
}
document.getElementById('q').addEventListener('keydown',function(e){
  if(e.key==='Enter') doSearch();
});
