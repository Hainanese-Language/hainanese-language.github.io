<ul class="senses"><li><span class="num">①</span><span><span class="zh">誊写；照原文写。～写、～录、～稿子。</span><span class="en">To copy out. 抄写; 抄录; 抄稿子.</span></span></li><li><span class="num">②</span><span><span class="zh">照搬别人的作品。～袭、～答案。</span><span class="en">To plagiarise. 抄袭; 抄答案.</span></span></li><li><span class="num">③</span><span><span class="zh">搜查并没收。～家、查～。</span><span class="en">To search and confiscate. 抄家; 查抄.</span></span></li><li><span class="num">④</span><span><span class="zh">从侧面或近路走。～近路、包～。</span><span class="en">To cut across; to take a short way. 抄近路; 包抄.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";
function doSearch(){
  var v=document.getElementById('q').value.trim();
  if(v) location.href=SITE+'/?q='+encodeURIComponent(v);
}
document.getElementById('q').addEventListener('keydown',function(e){
  if(e.key==='Enter') doSearch();
});
