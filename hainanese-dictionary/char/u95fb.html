<ul class="senses"><li><span class="num">①</span><span><span class="zh">听见。耳～、～所未～、百～不如一见。</span><span class="en">To hear. 耳闻; 闻所未闻; 百闻不如一见.</span></span></li><li><span class="num">②</span><span><span class="zh">消息；听到的事。新～、见～、要～。</span><span class="en">News; what one hears. 新闻; 见闻; 要闻.</span></span></li><li><span class="num">③</span><span><span class="zh">名声。～名、丑～、默默无～。</span><span class="en">Reputation. 闻名; 丑闻; 默默无闻.</span></span></li><li><span class="num">④</span><span><span class="zh">用鼻子嗅。～到香味、～～这药。</span><span class="en">To smell. 闻到香味; 闻闻这药.</span></span></li></ul></div><footer>
