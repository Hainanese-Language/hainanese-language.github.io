<p class="rb-py">téng</p>
<ul class="senses"><li><span class="num">①</span><span><span class="zh">某些植物细长而能攀缘的茎。～蔓、瓜～、顺～摸瓜。</span><span class="en">A slender climbing stem; a vine. 瓜藤 melon vine; 顺藤摸瓜 to follow a lead to its source.</span></span></li><li><span class="num">②</span><span><span class="zh">指白藤等，茎可编制器物。～椅、～条。</span><span class="en">Rattan, whose stems are woven into furniture. 藤椅 rattan chair.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";

    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";
