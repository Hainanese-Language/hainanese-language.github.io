<ul class="senses"><li><span class="num">①</span><span><span class="zh">抓着东西向上爬。～登、～岩、～援。</span><span class="en">to climb by holding on.</span></span></li><li><span class="num">②</span><span><span class="zh">拉扯；牵连。～折、～扯、～亲。</span><span class="en">to pull at; drag in.</span></span></li><li><span class="num">③</span><span><span class="zh">设法结交地位高的人。高～、～附、～交情。</span><span class="en">to seek the acquaintance of people of higher standing.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";
function doSearch(){
  var v=document.getElementById('q').value.trim();
  if(v) location.href=SITE+'/?q='+encodeURIComponent(v);
}
document.getElementById('q').addEventListener('keydown',function(e){
  if(e.key==='Enter') doSearch();
});
