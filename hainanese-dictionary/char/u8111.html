<ul class="senses"><li><span class="num">①</span><span><span class="zh">中枢神经系统的主要部分。大～、～袋、～神经。</span><span class="en">the brain, the main part of the central nervous system.</span></span></li><li><span class="num">②</span><span><span class="zh">指思考记忆的能力。～力、～子灵、动～筋。</span><span class="en">the power of thought and memory.</span></span></li><li><span class="num">③</span><span><span class="zh">从物体中提炼出的精华。樟～、薄荷～。</span><span class="en">an essence extracted from a substance.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";
function doSearch(){

}

});
