<ul class="senses"><li><span class="num">①</span><span><span class="zh">脚的后部。脚后～、高～鞋。</span><span class="en">The heel.</span></span></li><li><span class="num">②</span><span><span class="zh">在后面紧接着。～随、～上、～踪。</span><span class="en">To follow closely.</span></span></li><li><span class="num">③</span><span><span class="zh">引进动作的对象，相当于"向"。～他说、～朋友商量。</span><span class="en">Preposition introducing the party addressed: with; to.</span></span></li><li><span class="num">④</span><span><span class="zh">连词，和。我～你、纸～笔。</span><span class="en">Conjunction: and.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";
function doSearch(){
  var v=document.getElementById('q').value.trim();
  if(v) location.href=SITE+'/?q='+encodeURIComponent(v);
}
document.getElementById('q').addEventListener('keydown',function(e){
  if(e.key==='Enter') doSearch();
});
