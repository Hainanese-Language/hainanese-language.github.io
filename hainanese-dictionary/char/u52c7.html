<ul class="senses"><li><span class="num">①</span><span><span class="zh">有胆量；不怕危险。～敢、英～、～往直前。</span><span class="en">Bold; unafraid of danger. 勇敢 brave; 英勇 heroic; 勇往直前 to press bravely on.</span></span></li><li><span class="num">②</span><span><span class="zh">旧时指临时招募的士兵。散兵游～。</span><span class="en">In former times, a soldier taken on for a campaign. 散兵游勇 stragglers and disbanded soldiers.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
document.addEventListener('click',function(ev){
  document.querySelectorAll('.tip.open').forEach(function(t){
    if(!t.contains(ev.target)) t.classList.remove('open');});
  var t=ev.target.closest('.tip');
  if(t){ t.classList.toggle('open'); }
});
function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";

}
document.getElementById('q').addEventListener('keydown',function(e){
  if(e.key==='Enter') doSearch();
});
