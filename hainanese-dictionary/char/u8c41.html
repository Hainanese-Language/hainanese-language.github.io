<p class="rb-py">huō</p>
<ul class="senses"><li><span class="pyhead">〔huō〕</span></li><li><span class="num">①</span><span><span class="zh">残缺；裂开。～口、～了一道缝。</span><span class="en">Broken; split open.</span></span></li><li><span class="num">②</span><span><span class="zh">舍弃；不顾。～出去、～上性命。</span><span class="en">To give up; to risk regardless.</span></span></li><li><span class="pyhead">〔huò〕</span></li><li><span class="num">③</span><span><span class="zh">开阔；通达。～亮、～达、～然开朗。</span><span class="en">Open; wide; clear-sighted.</span></span></li><li><span class="num">④</span><span><span class="zh">免除。～免。</span><span class="en">To exempt; to remit.</span></span></li></ul></div><footer>

}
