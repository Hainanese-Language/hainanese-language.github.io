<ul class="senses"><li><span class="num">①</span><span><span class="zh">靠近。～晚、依山～水、～着大树。</span><span class="en">To be close to. 傍晚 towards evening; 依山傍水 set against hills and beside water; 傍着大树 close by a big tree.</span></span></li><li><span class="num">②</span><span><span class="zh">依靠。～人门户。</span><span class="en">To depend on. 傍人门户 to live under another's roof.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";
function doSearch(){

}

});
