<ul class="senses"><li><span class="num">①</span><span><span class="zh">可以治病的东西。～品、中～、吃～、～方。</span><span class="en">Medicine. 药品; 中药; 吃药; 药方.</span></span></li><li><span class="num">②</span><span><span class="zh">某些有特定作用的化学物品。火～、农～、炸～。</span><span class="en">Certain chemical preparations. 火药; 农药; 炸药.</span></span></li><li><span class="num">③</span><span><span class="zh">用药医治。不可救～。</span><span class="en">To cure with medicine. 不可救药.</span></span></li><li><span class="num">④</span><span><span class="zh">用毒药杀死。～老鼠。</span><span class="en">To kill with poison. 药老鼠.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";

  }
  next();
}
