<ul class="senses"><li><span class="num">①</span><span><span class="zh">支撑；顶住。～住门、～挡、～制。</span><span class="en">To prop up; to hold off. 抵住门; 抵挡; 抵制.</span></span></li><li><span class="num">②</span><span><span class="zh">顶；相撞。～触、～牾。</span><span class="en">To butt; to conflict. 抵触; 抵牾.</span></span></li><li><span class="num">③</span><span><span class="zh">相当；能代替。～偿、～债、一个～俩。</span><span class="en">To be equal to; to stand in for. 抵偿; 抵债; 一个抵俩.</span></span></li><li><span class="num">④</span><span><span class="zh">到达。～京、～达。</span><span class="en">To arrive at. 抵京; 抵达.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";

  }
  next();
}
