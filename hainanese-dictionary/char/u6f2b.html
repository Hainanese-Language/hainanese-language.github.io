<ul class="senses"><li><span class="num">①</span><span><span class="zh">水过满而流出；淹没。～出来、大水～过田地。</span><span class="en">To overflow; to submerge. 漫出来; 大水漫过田地.</span></span></li><li><span class="num">②</span><span><span class="zh">到处都是。～山遍野、～天大雾。</span><span class="en">All over the place. 漫山遍野; 漫天大雾.</span></span></li><li><span class="num">③</span><span><span class="zh">不受约束；随便。～步、～谈、～不经心。</span><span class="en">Unrestrained; casual. 漫步; 漫谈; 漫不经心.</span></span></li><li><span class="num">④</span><span><span class="zh">长；远。～长、路～～。</span><span class="en">Long; far. 漫长; 路漫漫.</span></span></li></ul></div><footer>
