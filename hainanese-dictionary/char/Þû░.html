<ul class="senses"><li><span class="num">①</span><span><span class="zh">一种香草。～衣草。</span><span class="en">A fragrant herb. 薰衣草 lavender.</span></span></li><li><span class="num">②</span><span><span class="zh">同"熏"，气味或烟气接触物体。～风、～染。</span><span class="en">Same as 熏: (of a smell or smoke) to reach and affect something. 薰风 a warm breeze; 薰染 to influence gradually.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";

}
