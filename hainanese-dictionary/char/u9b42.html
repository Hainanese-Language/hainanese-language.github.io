<ul class="senses"><li><span class="num">①</span><span><span class="zh">迷信指能离开人体存在的精神。灵～、～魄、～不附体。</span><span class="en">The soul, thought to exist apart from the body.</span></span></li><li><span class="num">②</span><span><span class="zh">精神；情绪。神～颠倒、～不守舍。</span><span class="en">Mood; state of mind.</span></span></li><li><span class="num">③</span><span><span class="zh">指崇高的精神。国～、民族～。</span><span class="en">The lofty spirit of a people or nation.</span></span></li></ul></div><footer>
