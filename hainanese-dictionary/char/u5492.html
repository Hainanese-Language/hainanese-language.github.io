<ul class="senses"><li><span class="num">①</span><span><span class="zh">某些宗教或迷信中的口诀。～语、念～、符～。</span><span class="en">An incantation. 咒语 a spell; 念咒 to chant a charm.</span></span></li><li><span class="num">②</span><span><span class="zh">说希望别人不顺利的话。～骂、～他倒霉。</span><span class="en">To curse; wish ill on. 咒骂 to revile.</span></span></li><li><span class="num">③</span><span><span class="zh">发誓。赌～。</span><span class="en">To swear an oath. 赌咒 to vow.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
document.addEventListener('click',function(ev){
  document.querySelectorAll('.tip.open').forEach(function(t){
    if(!t.contains(ev.target)) t.classList.remove('open');});

  if(t){ t.classList.toggle('open'); }

function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";

}
document.getElementById('q').addEventListener('keydown',function(e){
  if(e.key==='Enter') doSearch();
});
