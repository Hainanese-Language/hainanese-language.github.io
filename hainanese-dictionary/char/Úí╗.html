<ul class="senses"><li><span class="num">①</span><span><span class="zh">必须；应当。～知、务～、必～。</span><span class="en">Must; ought to. 须知 points for attention; 务须 be sure to; 必须 must.</span></span></li><li><span class="num">②</span><span><span class="zh">胡须。胡～、～发、～眉。</span><span class="en">A beard; whiskers. 胡须 a beard; 须眉 a man.</span></span></li><li><span class="num">③</span><span><span class="zh">像胡须的东西。触～、花～。</span><span class="en">Something resembling whiskers. 触须 antennae; 花须 stamens.</span></span></li></ul></div><footer>

<script>var AUDIO="/hainanese-dictionary/audio";
function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";
function doSearch(){
  var v=document.getElementById('q').value.trim();
  if(v) location.href=SITE+'/?q='+encodeURIComponent(v);
}
document.getElementById('q').addEventListener('keydown',function(e){
  if(e.key==='Enter') doSearch();
});
