<ul class="senses"><li><span class="num">①</span><span><span class="zh">供奉神佛或历史名人的处所。寺～、～宇、龙王～、孔～。</span><span class="en">A temple for gods, Buddhas or famous figures. 寺庙; 庙宇; 龙王庙; 孔庙.</span></span></li><li><span class="num">②</span><span><span class="zh">供奉祖先的房屋。宗～、家～、太～。</span><span class="en">An ancestral hall. 宗庙; 家庙; 太庙.</span></span></li><li><span class="num">③</span><span><span class="zh">庙会。赶～、～市。</span><span class="en">A temple fair. 赶庙; 庙市.</span></span></li></ul></div><footer>
