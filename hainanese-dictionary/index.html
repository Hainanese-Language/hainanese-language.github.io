<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海南话字典 · 查字</title>
<link rel="stylesheet" href="/hainanese-dictionary/style.css"></head>
<body><div class="page"><div class="bar"><div class="bar-row">
<label class="field"><span class="mag">&#8981;</span>
<input id="q" value="" placeholder="输入汉字、拼音或英文" autocomplete="off"></label>
<button class="gobtn" onclick="doSearch()">搜索</button></div></div>
<div class="hint">可以输入汉字、海南话拼音（如 <code>ddo</code>）、普通话拼音（如 <code>chang</code>），
或英文。声调可不打。<br><a href="/hainanese-dictionary/browse.html">按音节浏览 →</a></div>
<div id="out"></div><footer>
<a href="/">首页</a> · <a href="/hainanese-dictionary/browse.html">按音节浏览</a> ·
<a href="/submit/">补充词条</a><br>
<span class="cn">发音录音为临时版本，欢迎志愿者重录。</span>
</footer></div>
<script>var AUDIO="/hainanese-dictionary/audio";
document.addEventListener('click',function(ev){
  document.querySelectorAll('.tip.open').forEach(function(t){
    if(!t.contains(ev.target)) t.classList.remove('open');});
  var t=ev.target.closest('.tip');
  if(t){ t.classList.toggle('open'); }
});
function play(name){
  var list=name.split('|'), i=0;
  function next(){
    if(i>=list.length) return;
    var a=new Audio(AUDIO+'/'+list[i++]);
    a.onended=next;
    a.play().catch(function(){
      alert('这个读音的录音还没上传。\nRecording not uploaded yet.');});
  }
  next();
}
var SITE="/hainanese-dictionary";
var DATA=[],READY=false;
fetch(SITE+'/search-index.json').then(r=>r.json()).then(d=>{DATA=d;READY=true;run();});
function strip(s){
  return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
         .replace(/[¹²³⁴⁵⁶⁷⁸]/g,'').toLowerCase();
}
function words(s){return strip(s).split(/[^a-z]+/).filter(Boolean);}
function run(){
  var q=document.getElementById('q').value.trim();
  var out=document.getElementById('out');
  if(!q){out.innerHTML='';return;}
  if(!READY){out.innerHTML='<div class="rgroup">载入中…</div>';return;}
  var ql=strip(q), hits=[];
  for(var i=0;i<DATA.length&&hits.length<80;i++){
    var d=DATA[i],score=-1;
    if(d.c===q) score=0;
    else if(d.c.indexOf(q)>=0) score=1;
    else if(d.r.some(function(x){return strip(x)===ql;})) score=2;
    else if(words(d.p).indexOf(ql)>=0) score=3;
    else if(d.r.some(function(x){return strip(x).indexOf(ql)===0;})) score=4;
    else if(words(d.p).some(function(x){return x.indexOf(ql)===0;})) score=5;
    else if(words(d.e).indexOf(ql)>=0) score=6;
    else if((d.g||'').indexOf(q)>=0) score=7;
    else if((d.e||'').toLowerCase().indexOf(ql)>=0) score=8;
    if(score>=0) hits.push([score,d]);
  }
  hits.sort(function(a,b){return a[0]-b[0];});
  if(!hits.length){out.innerHTML='<div class="rgroup">没有找到 · No match</div>';return;}
  var h='<div class="rgroup">'+hits.length+' 条结果</div>';
  hits.forEach(function(p){var d=p[1];
    h+='<a class="res" href="'+SITE+'/char/'+d.u+'.html">'+
       '<span class="ch">'+d.c+'</span><span class="rd">'+d.r.join(' ')+'</span>'+
       '<span class="gl">'+(d.g||d.e||'')+'</span></a>';});
  out.innerHTML=h;
}
document.getElementById('q').addEventListener('input',run);
function doSearch(){run();}
var pre=new URLSearchParams(location.search).get('q');
if(pre){document.getElementById('q').value=pre;}
</script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "bf4e3c46518d4a6983f3f0fee06af0f0"}'></script>
</body></html>
