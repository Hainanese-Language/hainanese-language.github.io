<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海南话字典 · Hainanese Dictionary</title>
<style>
  :root{
    --paper:#FBFAF7; --ink:#17201F; --ink-soft:#5A625E;
    --rule:#E2DED4; --rule-strong:#B9B2A3;
    --hai:#0E5A53; --hai-deep:#083C37;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",serif;
    --sans:"Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.65}
  .wrap{max-width:640px;margin:0 auto;padding:64px 20px 80px}
  h1{font-size:34px;color:var(--hai);margin:0 0 4px;letter-spacing:.5px}
  .sub{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
       color:var(--ink-soft);margin:0 0 32px}
  .lede{color:var(--ink-soft);font-size:15px;margin:0 0 34px}
  a.card{display:block;text-decoration:none;color:inherit;background:#fff;
         border:1px solid var(--rule-strong);padding:18px 20px;margin-bottom:14px}
  a.card:hover{border-color:var(--hai);box-shadow:0 1px 0 var(--hai)}
  a.card b{display:block;font-size:20px;color:var(--hai)}
  a.card span{display:block;font-family:var(--sans);font-size:13px;color:var(--ink-soft);margin-top:4px}
  footer{border-top:1px solid var(--rule);margin-top:40px;padding-top:14px;
         font-family:var(--sans);font-size:12px;color:var(--ink-soft)}
</style></head>
<body><div class="wrap">
<h1>海南话字典</h1>
<p class="sub">Hainanese Dictionary</p>
<p class="lede">共 4975 个字头、5839 条读音、517 个音节，附录音。按海南话读音排列。</p>

<a class="card" href="/hainanese-dictionary/"><b>查字典 · Browse the dictionary</b>
<span>按音节浏览，搜字、海南话拼音或普通话拼音</span></a>

<a class="card" href="/submit/"><b>词语征集 · Submit a word</b>
<span>提交你知道的海南话词语</span></a>

<footer>hainanese-language.github.io</footer>
</div></body></html>
